{% extends 'base.html' %}
{% block content %}
<div class="auth-wrap"><div class="auth-card">
  <div class="eyebrow">ACCOUNT SECURITY</div><h1>Change password</h1><p class="text-muted">Use a password with at least 12 characters.</p>
  <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="form-label mt-2">Current password</label><input class="form-control" name="current_password" type="password" autocomplete="current-password" required>
    <label class="form-label mt-3">New password</label><input class="form-control" name="new_password" type="password" minlength="12" autocomplete="new-password" required>
    <label class="form-label mt-3">Confirm new password</label><input class="form-control" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required>
    <button class="btn btn-primary w-100 mt-4">Update password</button>
  </form>
</div></div>
{% endblock %}
